<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">MD. Afnan</title>
  <desc id="d">Student from Bangladesh. I build things on the web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E13"/>
      <stop offset="1" stop-color="#12202B"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
      <circle cx="2" cy="2" r="1.4" fill="#9FB3C8" fill-opacity="0.16"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="14s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FBF8F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1FBF8F"/>
      <stop offset="1" stop-color="#1FBF8F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="105" y="212" width="790" height="52">
        <animate attributeName="width" values="0;0;790" keyTimes="0;0.3;1" dur="3s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="1000" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="20" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="998.5" height="318.5" rx="19.5" fill="none" stroke="#1E2C3A" stroke-width="1.5"/>
  <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#5C7184">~/afnanmakes</text>
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.9s" begin="0s" fill="freeze"/>
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#E8EEF4" letter-spacing="1">MD. Afnan</text>
  </g>
  <rect x="300" y="196" width="400" height="3" fill="url(#fade)">
    <animate attributeName="x" values="500;500;300" keyTimes="0;0.4;1" dur="1.4s" begin="0s" fill="freeze"/>
    <animate attributeName="width" values="0;0;400" keyTimes="0;0.4;1" dur="1.4s" begin="0s" fill="freeze"/>
  </rect>
  <g clip-path="url(#type)">
    <text x="105" y="250" textLength="790" lengthAdjust="spacingAndGlyphs" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="32" fill="#A9B8C6">Student from Bangladesh. I build things on the web.</text>
  </g>
  <rect x="900" y="218" width="3" height="38" fill="#1FBF8F">
    <animate attributeName="x" values="105;105;900" keyTimes="0;0.3;1" dur="3s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/>
  </rect>
</svg>
